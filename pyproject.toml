[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kanna0314-infergw_jd329"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出推理网关架构师·KV Cache 复用与前缀共享上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kanna0314" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kanna0314.github.io"
Repository = "https://github.com/kanna0314/infergw_jd329"
Issues = "https://github.com/kanna0314/infergw_jd329/issues"

[project.scripts]
infergw_jd329 = "infergw_jd329:main"

[tool.setuptools]
py-modules = ["infergw_jd329"]
